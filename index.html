<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator | حاسبة العمر</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: white;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 500px;
        width: 90%;
      }

      h1 {
        color: #2c3e50;
        margin-bottom: 1.5rem;
      }

      h3 {
        color: #34495e;
        margin: 1rem 0;
      }

      input[type="date"] {
        padding: 0.5rem;
        border: 2px solid #ddd;
        border-radius: 5px;
        margin: 1rem 0;
        width: 80%;
        max-width: 300px;
        font-size: 30px;
      }

      button {
        background: #3498db;
        color: white;
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
        transition: background 0.3s;
        margin: 1rem 0;
      }

      button:hover {
        background: #2980b9;
      }

      .result {
        margin-top: 2rem;
        padding: 1rem;
        background: #f8f9fa;
        border-radius: 5px;
      }

      .result h1 {
        color: #2c3e50;
        font-size: 1.5rem;
        margin: 0.5rem 0;
      }

      .rtl {
        direction: rtl;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Age Calculator | حاسبة العمر</h1>
      <div class="rtl">
        <h3>ادخل تاريخ ميلادك</h3>
      </div>
      <h3>Enter your date of birth</h3>
      <input type="date" id="date1" />
      <button onclick="calculateAge()" id="calc">Calculate | احسب</button>
      
      <div class="result">
        <h1 id="age1"></h1>
        <h1 id="age2"></h1>
        <h1 id="age3"></h1>
        <h1 id="age4"></h1>
        <h1 id="age5"></h1>
        <h1 id="age6"></h1>
      </div>
    </div>

    <script>
      function calculateAge() {
        const birthDate = new Date(document.getElementById("date1").value);
        const today = new Date();
        
        if (isNaN(birthDate.getTime())) {
          alert("Please enter a valid date");
          return;
        }

        let years = today.getFullYear() - birthDate.getFullYear();
        let months = today.getMonth() - birthDate.getMonth();
        let days = today.getDate() - birthDate.getDate();

        if (days < 0) {
          months--;
          days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        }
        if (months < 0) {
          years--;
          months += 12;
        }

        const totalDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));
        const totalHours = totalDays * 24;
        const totalMinutes = totalHours * 60;
        const totalSeconds = totalMinutes * 60;

        document.getElementById(
          "age1"
        ).innerHTML = `Your age is: ${years} years,<br> ${months} months,<br> ${days} days`;
        document.getElementById("age2").innerHTML = `Total days: ${totalDays}`;
        document.getElementById("age3").innerHTML = `Total hours: ${totalHours}`;
        document.getElementById("age4").innerHTML = `Total minutes: ${totalMinutes}`;
        document.getElementById("age5").innerHTML = `Total seconds: ${totalSeconds}`;
        
        // Live seconds counter
        let secondsCounter = totalSeconds;
        const interval = setInterval(() => {
          secondsCounter++;
          document.getElementById("age6").innerHTML = `Live seconds: ${secondsCounter}`;
        }, 1000);

        // Clear interval when new date is selected
        document.getElementById("date1").addEventListener("change", () => {
          clearInterval(interval);
        });
      }
    </script>
  </body>
</html>
